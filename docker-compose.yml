# @file docker-compose.yml
# @module Infrastructure
# @description Local services with credentials supplied by the ignored root .env.
services:
  # -------------------------------------------------------------
  # 1. Redis Server (Backend / BullMQ / Cache)
  # -------------------------------------------------------------
  redis-server:
    image: redis:alpine
    container_name: sap-phim-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-server-data:/data

  # -------------------------------------------------------------
  # 2. Jikan REST v4 API Stack
  # -------------------------------------------------------------
  jikan_rest:
    image: jikanme/jikan-rest:latest
    container_name: sap-phim-jikan-rest
    environment:
      - APP_ENV=production
      - CACHE_DRIVER=redis
      - REDIS_HOST=jikan_redis
      - DB_CONNECTION=mongodb
      - DB_HOST=jikan_mongo
      - DB_DATABASE=jikan
      - QUEUE_CONNECTION=database
      - SCOUT_DRIVER=collection
    ports:
      - "8000:8080"
    restart: unless-stopped
    depends_on:
      - jikan_redis
      - jikan_mongo

  jikan_redis:
    image: redis:alpine
    container_name: sap-phim-jikan-redis
    restart: unless-stopped
    volumes:
      - jikan-redis-data:/data

  jikan_mongo:
    image: mongo:6.0
    container_name: sap-phim-jikan-mongo
    restart: unless-stopped
    volumes:
      - jikan-mongo-data:/data/db

  # -------------------------------------------------------------
  # 3. Nginx Gateway (Video Streaming & TUS Upload Proxy)
  # -------------------------------------------------------------
  nginx-gateway:
    image: nginx:alpine
    container_name: sapanime_nginx_gateway
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/video-server/storage/media:/app/storage/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # -------------------------------------------------------------
  # 4. Video Processing Server (TUS Upload, FFmpeg, BullMQ)
  # -------------------------------------------------------------
  video-server:
    build:
      context: ./apps/video-server
      dockerfile: Dockerfile
    container_name: sap-phim-video-server
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - REDIS_HOST=redis-server
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}
      - INTERNAL_KEY=${VIDEO_SERVER_API_KEY:?Set VIDEO_SERVER_API_KEY in root .env}
      - UPLOAD_TOKEN_SECRET=${UPLOAD_TOKEN_SECRET:?Set UPLOAD_TOKEN_SECRET in root .env}
      - UPLOAD_DIR=./storage/uploads
      - OUTPUT_DIR=./storage/media
      - MAIN_BACKEND_URL=http://host.docker.internal:5000
    volumes:
      - ./apps/video-server/storage/media:/app/storage/media
      - ./apps/video-server/storage/uploads:/app/storage/uploads
    depends_on:
      - redis-server
    restart: unless-stopped

volumes:
  redis-server-data:
  jikan-redis-data:
  jikan-mongo-data:

