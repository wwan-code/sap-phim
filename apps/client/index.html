<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" id="app-theme-color" content="#07080a" />

  <!-- Critical Anti-FOUC & Theme Background Styles -->
  <style>
    html,
    body {
      background-color: #07080a;
      color: #f4f4f6;
      margin: 0;
      padding: 0;
    }

    html[data-theme="light"],
    html[data-theme="light"] body {
      background-color: #f8f9fc !important;
      color: #111318 !important;
    }

    html[data-theme="dark"],
    html[data-theme="dark"] body {
      background-color: #07080a !important;
      color: #f4f4f6 !important;
    }
  </style>

  <!-- Pre-render Theme Initialization Script (Anti-Flash) -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('sap-phim-theme') || 'system';
        var theme = pref;
        if (pref === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var metaTheme = document.getElementById('app-theme-color') || document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', theme === 'dark' ? '#07080a' : '#f8f9fc');
        }
      } catch (e) { }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
