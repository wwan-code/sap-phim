# =============================================================
# NGINX Configuration for Sạp Phim Video Streaming & TUS Upload
# =============================================================

server {
    listen 80;
    server_name localhost;

    # Client body settings cho TUS Video Uploads (lên tới 20GB)
    client_max_body_size 20G;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.apple.mpegurl;

    # -------------------------------------------------------------
    # 1. TUS Resumable Upload Proxy -> Video Server (port 3002)
    # -------------------------------------------------------------
    location /upload/tus/ {
        proxy_pass http://host.docker.internal:3002/upload/tus/;
        proxy_http_version 1.1;

        # Disable buffering để hỗ trợ stream chunks trực tiếp
        proxy_buffering off;
        proxy_request_buffering off;

        # TUS headers forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Tus-Resumable $http_tus_resumable;
        proxy_set_header Upload-Length $http_upload_length;
        proxy_set_header Upload-Offset $http_upload_offset;
        proxy_set_header Upload-Metadata $http_upload_metadata;
        proxy_set_header X-Upload-Token $http_x_upload_token;

        # CORS Headers cho TUS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, HEAD, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-Upload-Token, Upload-Length, Upload-Offset, Upload-Metadata, Tus-Resumable" always;
        add_header Access-Control-Expose-Headers "Upload-Offset, Location, Upload-Length, Tus-Version, Tus-Resumable, Tus-Max-Size, Tus-Extension, Upload-Metadata" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # -------------------------------------------------------------
    # 2. HLS Media Delivery (fMP4, Master Playlists & Storyboard Sprites)
    # -------------------------------------------------------------

    # HLS Segments (.m4s, init.mp4) — Immutable cache 1 năm
    location ~* \.(m4s|mp4)$ {
        alias /app/storage/media/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Accept-Ranges bytes always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # HLS Playlists (.m3u8) — Không cache để cập nhật ABR tức thì
    location ~* \.m3u8$ {
        alias /app/storage/media/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Storyboard Sprites & WebVTT — Cache 1 ngày
    location ~* \.(vtt|jpg|webp)$ {
        alias /app/storage/media/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Thư mục tĩnh media tổng quát
    location /media/ {
        alias /app/storage/media/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes always;
    }

    # -------------------------------------------------------------
    # 3. Proxy tới Main Backend API (port 5000)
    # -------------------------------------------------------------
    location /api/ {
        proxy_pass http://host.docker.internal:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------
    # 4. Proxy tới Client Frontend (port 5173) hoặc Root
    # -------------------------------------------------------------
    location / {
        proxy_pass http://host.docker.internal:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
